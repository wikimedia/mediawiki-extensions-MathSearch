<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math REST API sandbox</title>
<!--
	Browse and try the endpoints without installing anything: this file is
	served from the wiki's own origin, so "Try it out" reaches rest.php
	without running into cross-origin rules. Special:RestSandbox does the
	same job, but only comes with the WikimediaCustomizations extension.
-->
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
<style>body { margin: 0; }</style>
</head>
<body>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
window.onload = function () {
	window.ui = SwaggerUIBundle( {
		url: 'math-v0.json',
		dom_id: '#swagger-ui',
		deepLinking: true,
		tryItOutEnabled: true
	} );
};
</script>
</body>
</html>
